spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/horse_health}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# To allow CORS from anywhere
server:
  port: 8080

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8001}   # FastAPI AI 서버 포트

jwt:
  secret: horrse-jwt-secret-key-2026-very-long-string-for-security

firebase:
  service-account-file: firebase-service-account.json